<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統合初級講座 動画視聴</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --accent: #8b6f47;
      --accent-light: #c4a882;
      --accent-bg: #f5ede0;
      --border: #e8e0d5;
      --error: #c0392b;
      --shadow: 0 4px 24px rgba(139,111,71,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      min-height: 100vh;
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 52px 48px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
    }

    .login-card h1 {
      font-family: 'Noto Serif JP', serif;
      font-weight: 400;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .login-card p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 36px;
      line-height: 1.7;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      transition: border-color 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent-light);
      background: var(--surface);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 2px;
      font-size: 13px;
      letter-spacing: 0.15em;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn:hover { background: #7a5f3a; }

    .error-msg {
      margin-top: 16px;
      font-size: 13px;
      color: var(--error);
      text-align: center;
      display: none;
    }

    .expired-msg {
      margin-top: 16px;
      font-size: 13px;
      color: var(--error);
      background: #fdf0ee;
      border: 1px solid #f5c6c0;
      border-radius: 2px;
      padding: 12px 16px;
      text-align: center;
      display: none;
      line-height: 1.6;
    }

    #viewer {
      display: none;
      width: 100%;
      max-width: 900px;
    }

    .viewer-header {
      margin-bottom: 24px;
      text-align: center;
    }

    .viewer-header h2 {
      font-family: 'Noto Serif JP', serif;
      font-weight: 400;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .deadline-badge {
      display: inline-block;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid var(--accent-light);
      border-radius: 2px;
      padding: 4px 14px;
      font-size: 12px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 12px;
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      border-color: var(--accent-light);
      color: var(--accent);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .video-wrapper {
      background: #000;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      padding-top: 56.25%;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .now-playing {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
    }

    .now-playing span {
      color: var(--accent);
      font-weight: 500;
    }

    .viewer-footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="logo">統合初級講座</div>

  <div class="login-card fade-in" id="loginCard">
    <h1>動画を視聴する</h1>
    <p>メールアドレスと視聴パスワードを入力してください。</p>

    <div class="field">
      <label>メールアドレス</label>
      <input type="email" id="emailInput" placeholder="example@email.com">
    </div>
    <div class="field">
      <label>視聴パスワード</label>
      <input type="password" id="passInput" placeholder="パスワードを入力">
    </div>

    <button class="btn" onclick="checkAccess()">視聴する →</button>

    <div class="error-msg" id="errorMsg">メールアドレスまたはパスワードが正しくありません。</div>
    <div class="expired-msg" id="expiredMsg">
      視聴期限が終了しています。<br>
      ご不明な点はお問い合わせください。
    </div>
  </div>

  <div id="viewer">
    <div class="viewer-header fade-in">
      <h2>統合初級講座</h2>
      <div class="deadline-badge" id="deadlineText"></div>
    </div>

    <div class="tabs fade-in" id="tabArea"></div>

    <div class="video-wrapper fade-in">
      <iframe id="videoFrame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="now-playing">再生中：<span id="nowPlayingTitle"></span></div>

    <div class="viewer-footer">
      ※この動画はダウンロード不可です。視聴期限を過ぎるとアクセスできなくなります。
    </div>
  </div>

  <script>
    // ============================================================
    // ★ここを編集してください★
    // お客さんが増えたらこの中に追加していきます
    // ============================================================
    const USERS = [
      // 例（テスト用・動作確認後は消してください）：
      // {
      //   email: "test@example.com",
      //   password: "TEST1234",
      //   deadline: "2026-06-30",
      // },
    ];

    // 動画リスト（全員共通）
    const VIDEOS = [
      {
        title: "1日目（午前）",
        url: "https://drive.google.com/file/d/1LWOxlscM6Yw9ysFhaYRDsIF8SOzIJZcP/preview"
      },
      {
        title: "1日目（午後）",
        url: "https://drive.google.com/file/d/1L9W3___B2Gi-Saa-VZjmpQsY-vozVBbV/preview"
      },
      {
        title: "2日目（午前①）",
        url: "https://drive.google.com/file/d/1exsjYtPjcGKbXZZQbZfCNRpPQjcH2XIc/preview"
      },
      {
        title: "2日目（午前②）",
        url: "https://drive.google.com/file/d/1W_hIcoro7e_gSG9RXRO4-aHwGA40Bc-I/preview"
      },
      {
        title: "2日目（午後）",
        url: "https://drive.google.com/file/d/1tsgpgMODID77WlYUz2_BTqR8R5AUyjk9/preview"
      },
    ];
    // ============================================================

    function checkAccess() {
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const pass = document.getElementById('passInput').value.trim();
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('expiredMsg').style.display = 'none';

      const user = USERS.find(u => u.email.toLowerCase() === email && u.password === pass);

      if (!user) {
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const deadline = new Date(user.deadline);
      deadline.setHours(23, 59, 59, 999);

      if (today > deadline) {
        document.getElementById('expiredMsg').style.display = 'block';
        return;
      }

      const dl = new Date(user.deadline);
      const dlStr = `視聴期限：${dl.getFullYear()}年${dl.getMonth()+1}月${dl.getDate()}日まで`;
      document.getElementById('deadlineText').textContent = dlStr;

      const tabArea = document.getElementById('tabArea');
      tabArea.innerHTML = '';
      VIDEOS.forEach((v, i) => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
        btn.textContent = v.title;
        btn.onclick = () => switchVideo(i);
        tabArea.appendChild(btn);
      });

      switchVideo(0);

      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('viewer').style.display = 'block';
    }

    function switchVideo(index) {
      document.getElementById('videoFrame').src = VIDEOS[index].url;
      document.getElementById('nowPlayingTitle').textContent = VIDEOS[index].title;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') checkAccess();
    });
  </script>

</body>
</html>
